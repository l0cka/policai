  <text x="124" y="236" text-anchor="middle" font-size="14" fill="#4338CA">Deterministic code hooks</text>

  <line x1="232" y1="216" x2="260" y2="216" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="272" y="32" width="664" height="368" rx="20" fill="#F6F7FB" stroke="#D9DEE8"/>
  </g>
  <text x="604" y="62" text-anchor="middle" font-size="14" fill="#64748B">Cursor-managed or self-hosted</text>

