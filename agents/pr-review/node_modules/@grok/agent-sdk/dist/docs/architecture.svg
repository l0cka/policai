    <g filter="url(#soft)"><rect x="296" y="88" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="393" y="120">Source control + Issue</text>
    <text x="393" y="141">tracker + Slack triggers</text>

    <g filter="url(#soft)"><rect x="507" y="88" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="604" y="131">Model routing</text>

    <g filter="url(#soft)"><rect x="718" y="88" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="815" y="131">Evals</text>

    <g filter="url(#soft)"><rect x="296" y="188" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="393" y="231">MCP connections</text>

    <g filter="url(#soft)"><rect x="507" y="188" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="604" y="220">Sessions &#183; Model loops</text>
    <text x="604" y="241">Subagents &#183; Tool calls</text>

    <g filter="url(#soft)"><rect x="718" y="188" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="815" y="231">Secret management</text>

    <g filter="url(#soft)"><rect x="296" y="288" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
    <text x="393" y="331">Sandboxing</text>

    <g filter="url(#soft)"><rect x="507" y="288" width="194" height="76" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/></g>
