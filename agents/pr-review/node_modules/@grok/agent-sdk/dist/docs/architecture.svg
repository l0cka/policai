<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img">
  <title>Agent SDK architecture: you bring the agent as code, the platform provides triggers, runtime, integrations, and operations</title>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="430" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <text x="124" y="122" text-anchor="middle" font-size="13" fill="#6B7280">You bring the code and ideas</text>
