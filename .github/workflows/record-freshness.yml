name: Record freshness

# Fails when overdue public records exceed data/freshness-budget.json.
# Time-based, so it also runs weekly: records go stale without any push.
# On pull requests it runs only when records or the code that ages them change.
# Kept out of `npm run check` so unrelated local work is not blocked by the
# calendar.
on:
  pull_request:
    branches:
      - main
    paths:
      - data/**
      - scripts/check-freshness.ts
      - src/lib/**
      - package.json
      - package-lock.json
      - .github/workflows/record-freshness.yml
  schedule:
    - cron: "0 22 * * 0" # Monday 08:00 AEST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: record freshness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, argus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check record freshness budget
        run: npm run check:freshness
