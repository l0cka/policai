name: Cloudflare deploy

# Builds the site for Workers and deploys it on every push to main, so a
# collector data commit goes live within minutes. Runs on a GitHub-hosted
# runner so the deploy token never sits on Argus. The Worker answers only on
# workers.dev until wrangler.jsonc routes policai.org to it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older deploy; each one ships all of main.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:cloudflare
      # Unlike `wrangler deploy`, this also uploads the prerendered pages to
      # the static-assets cache; without them every request renders afresh.
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
