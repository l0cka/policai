name: Cloudflare deploy

# Builds the site for Workers and deploys it from a GitHub-hosted runner, so
# the deploy token never sits on Argus. The Worker answers only on
# workers.dev until wrangler.jsonc routes policai.org to it.
#
# PRs merged by auto-merge land through GITHUB_TOKEN, and GitHub starts no
# workflow for a push made that way. So a five-minute schedule also checks
# whether main is newer than the last successful deploy.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

# Runs queue rather than cancel: a scheduled check must not abort a deploy
# in flight, and once it finishes the queued check finds main up to date.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - id: compare
        uses: actions/github-script@v7
        with:
          script: |
            const { data: [latest] } = await github.rest.repos.listDeployments({
              ...context.repo,
              environment: 'cloudflare-preview',
              per_page: 1,
            });
            let deployed = null;
            if (latest) {
              const { data: [status] } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo,
                deployment_id: latest.id,
                per_page: 1,
              });
              if (status?.state === 'success') deployed = latest.sha;
            }
            const stale = context.eventName !== 'schedule' || deployed !== context.sha;
            core.info(`main ${context.sha}, deployed ${deployed ?? 'none'}: ${stale ? 'deploying' : 'up to date'}`);
            core.setOutput('stale', String(stale));

  deploy:
    name: deploy
    needs: check
    if: ${{ needs.check.outputs.stale == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:cloudflare
      # Unlike `wrangler deploy`, this also uploads the prerendered pages to
      # the static-assets cache; without them every request renders afresh.
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
