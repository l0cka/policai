name: Collector proposals

# Keeps one open `collector-proposal` issue per automatic source that has
# failed three collection runs in a row, and closes it once the source
# succeeds again or leaves the automatic catalogue. It only proposes: a person
# decides on a decision card, and the move to manual is a reviewed code change.
# Runs when a collection merge updates the source-health ledger, and on a
# schedule, because auto-merge lands collection PRs with GITHUB_TOKEN and
# those pushes start no workflows.
on:
  push:
    branches:
      - main
    paths:
      - data/watch-state.json
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: collector-proposals

jobs:
  proposals:
    name: collector proposals
    runs-on: [self-hosted, linux, argus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Sync proposal issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          npm run collector:proposals -- --sync-issues | tee "$GITHUB_STEP_SUMMARY"
