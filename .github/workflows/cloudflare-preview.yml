name: Cloudflare preview

# Builds the site for Workers and deploys it to policai.<account>.workers.dev.
# wrangler.jsonc has no routes, so this never touches policai.org. Runs on a
# GitHub-hosted runner so the deploy token never sits on Argus.
on:
  workflow_dispatch:
  # Until this file is on main, a push to the spike branch is the only trigger.
  push:
    branches:
      - claude/project-thread-hkqaqh

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy preview
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
