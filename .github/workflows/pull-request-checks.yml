name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same PR supersedes the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required checks must report on every PR, so the Pro Bono jobs always run
  # and skip only their steps when apps/probono is untouched. Host dispatcher
  # is not required and skips as a whole job. If this job fails, everything
  # runs, so a broken diff never reads as a passing skip.
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, argus]
    outputs:
      probono: ${{ steps.diff.outputs.probono }}
      host: ${{ steps.diff.outputs.host }}
      review_agent: ${{ steps.diff.outputs.review_agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The checkout is the PR merge commit, so its first parent is the base.
      - name: Detect changed areas
        id: diff
        run: |
          set -euo pipefail
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files"
          matches() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          workflow='^\.github/workflows/pull-request-checks\.yml$'
          {
            echo "probono=$(matches "^apps/probono/|$workflow")"
            echo "host=$(matches "^ops/host/|$workflow")"
            echo "review_agent=$(matches "^agents/pr-review/|$workflow")"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, argus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck root application
        run: npm run typecheck

  test:
    name: test
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, argus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Test collector publication wrapper
        run: python3 -m unittest discover -s ops/collector -p 'test_*.py' -v

      - name: Validate data
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:data

  build:
    name: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, argus]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  probono-dashboard:
    name: Pro Bono dashboard
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, argus]
    defaults:
      run:
        working-directory: apps/probono/dashboard
    # Build is database-free; never inherit production connection settings.
    env:
      DATABASE_URL: ''
      AFFECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.probono == 'true' }}
    steps:
      - name: Skip, Pro Bono code unchanged
        if: ${{ env.AFFECTED != 'true' }}
        working-directory: .
        run: echo 'No change under apps/probono; checks skipped.'
      - uses: actions/checkout@v4
        if: ${{ env.AFFECTED == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.AFFECTED == 'true' }}
        with:
          node-version: 24
      - name: Install dashboard dependencies
        if: ${{ env.AFFECTED == 'true' }}
        run: npm ci
      - name: Typecheck dashboard
        if: ${{ env.AFFECTED == 'true' }}
        run: npm run typecheck
      - name: Test dashboard
        if: ${{ env.AFFECTED == 'true' }}
        run: npm test
      - name: Build dashboard
        if: ${{ env.AFFECTED == 'true' }}
        run: npm run build

  probono-worker:
    name: Pro Bono worker
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, argus]
    defaults:
      run:
        working-directory: apps/probono/worker
    env:
      AFFECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.probono == 'true' }}
    # Integration fixtures DELETE table contents. Only this disposable Postgres
    # may be used: no repository secrets, production Compose, or data volumes.
    # Start it with `docker run` rather than Actions `services:` — on Argus the
    # service-container helper fails at Initialize containers with
    # `/proc/1/cgroup` missing and a null network (2026-10-20).
    steps:
      - name: Skip, Pro Bono code unchanged
        if: ${{ env.AFFECTED != 'true' }}
        working-directory: .
        run: echo 'No change under apps/probono; checks skipped.'
      - uses: actions/checkout@v4
        if: ${{ env.AFFECTED == 'true' }}
      - name: Start disposable Postgres for CI
        id: pg
        if: ${{ env.AFFECTED == 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          name="probono-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "container=$name" >> "$GITHUB_OUTPUT"
          # Argus runs several runner slots on one rootless Docker. Ephemeral
          # host ports (-p 127.0.0.1::5432) collided across slots with
          # "bind: address already in use", so each slot gets its own fixed
          # port below Docker's ephemeral range, and a container a cancelled
          # run left on this slot is removed first.
          slot="$(printf '%s' "$RUNNER_WORKSPACE" | sed -n 's#.*/slots/\([0-9]\{1,3\}\)/.*#\1#p')"
          if [ -n "$slot" ]; then
            publish="127.0.0.1:$((25400 + slot)):5432"
            docker ps -aq --filter "label=probono-ci-slot=$slot" | xargs -r docker rm -f >/dev/null
          else
            publish="127.0.0.1::5432"
          fi
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            --label "probono-ci-slot=${slot:-none}" \
            -e POSTGRES_USER=probono_ci \
            -e POSTGRES_PASSWORD=probono_ci \
            -e POSTGRES_DB=probono_ci_test \
            -p "$publish" \
            postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec "$name" pg_isready -U probono_ci -d probono_ci_test >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$name" pg_isready -U probono_ci -d probono_ci_test
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$name")"
          test -n "$port"
          echo "port=$port" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: ${{ env.AFFECTED == 'true' }}
        with:
          node-version: 24
      - name: Install worker dependencies
        if: ${{ env.AFFECTED == 'true' }}
        run: npm ci
      - name: Typecheck worker
        if: ${{ env.AFFECTED == 'true' }}
        run: npm run typecheck
      - name: Initialize disposable test database
        if: ${{ env.AFFECTED == 'true' }}
        env:
          DATABASE_URL: postgres://probono_ci:probono_ci@127.0.0.1:${{ steps.pg.outputs.port }}/probono_ci_test
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const url = new URL(process.env.DATABASE_URL);
          if (url.hostname !== '127.0.0.1' || url.pathname !== '/probono_ci_test' || url.username !== 'probono_ci') {
            throw new Error('Refusing to initialize a non-CI database');
          }
          const client = new pg.Client({ connectionString: url.href });
          await client.connect();
          try {
            await client.query(readFileSync('../db/schema.sql', 'utf8'));
          } finally {
            await client.end();
          }
          JS
      - name: Run unit and database integration tests
        if: ${{ env.AFFECTED == 'true' }}
        env:
          DATABASE_URL: postgres://probono_ci:probono_ci@127.0.0.1:${{ steps.pg.outputs.port }}/probono_ci_test
        run: npm test
      - name: Run enrichment security tests
        if: ${{ env.AFFECTED == 'true' }}
        run: npm run test:security
      - name: Stop disposable Postgres
        if: ${{ always() && env.AFFECTED == 'true' }}
        working-directory: .
        run: docker rm -f "${{ steps.pg.outputs.container }}" >/dev/null 2>&1 || true

  pr-review-agent:
    name: PR review agent
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.review_agent == 'true') }}
    runs-on: [self-hosted, linux, argus]
    defaults:
      run:
        working-directory: agents/pr-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install agent dependencies
        run: npm ci
      - name: Typecheck and test agent
        run: npm run check

  host-dispatcher:
    name: Host dispatcher
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.host == 'true') }}
    runs-on: [self-hosted, linux, argus]
    steps:
      - uses: actions/checkout@v4
      # Arch runners have no actions/setup-python cache for 3.11. Use system
      # python3 (3.14 on Argus); ops/host/README.txt requires >=3.11.
      - name: Require system Python >= 3.11
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python3 --version
      - name: Verify reviewed host source manifest
        working-directory: ops/host
        run: sha256sum --check MANIFEST.sha256
      - name: Check Docker Compose parser availability
        run: docker compose version
      - name: Run offline deployment and rollback tests
        run: python3 -B ops/host/verify.py
      - name: Retain host verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-verification
          path: ops/host/logs/FINAL-VERIFICATION.json
          if-no-files-found: error
