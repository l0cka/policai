name: Cursor review

# Stamps the `cursor-review` Check Run. Cursor Cloud Agents cannot write
# check runs (403); this workflow's GITHUB_TOKEN can. The Cursor Automation
# (cursor[bot]) writes the review. A marker in the review body tells this workflow
# the conclusion for the commit that review covers. Conversation comments
# are ignored: they carry no commit, so a marker there could pass a head
# nobody reviewed. `cursor-review` is a required check in
# Protect main, so auto-merge and thread merges wait for it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  checks: write
  contents: read
  pull-requests: read

# One stamp at a time per PR, so a completion cannot race a new head SHA's
# in_progress run and land on the wrong commit.
concurrency:
  group: cursor-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  stamp:
    name: stamp cursor-review
    # Drafts have no review request yet. ready_for_review fires once the
    # draft flag is clear, and that event creates the run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or complete the cursor-review check
        uses: actions/github-script@v7
        with:
          script: |
            const CHECK_NAME = 'cursor-review';
            const MARKER = /<!-- cursor-review: (success|failure) -->/gi;

            // The Cursor Automation reviews as the cursor[bot] app. Only its
            // marker counts: GitHub reserves [bot] logins for apps, so neither
            // a stranger nor the PR author's own account can pass the check.
            function fromCursor(user) {
              return user?.login === 'cursor[bot]' && user?.type === 'Bot';
            }

            function markerConclusion(body, user) {
              if (!body || !fromCursor(user)) return null;
              const matches = [...body.matchAll(MARKER)];
              if (matches.length === 0) return null;
              return matches[matches.length - 1][1].toLowerCase();
            }

            async function runsFor(sha) {
              const runs = [];
              for (let page = 1; page <= 10; page += 1) {
                const { data } = await github.rest.checks.listForRef({
                  ...context.repo,
                  ref: sha,
                  check_name: CHECK_NAME,
                  per_page: 100,
                  page,
                });
                runs.push(...data.check_runs.filter((run) => run.name === CHECK_NAME));
                if (data.check_runs.length < 100) break;
              }
              return runs;
            }

            function newestInProgress(runs) {
              return runs
                .filter((run) => run.status === 'in_progress')
                .sort((a, b) => b.id - a.id)[0];
            }

            async function start(sha) {
              const existing = newestInProgress(await runsFor(sha));
              if (existing) {
                core.info(`cursor-review ${existing.id} already in progress on ${sha}.`);
                return;
              }
              await github.rest.checks.create({
                ...context.repo,
                name: CHECK_NAME,
                head_sha: sha,
                status: 'in_progress',
                output: {
                  title: 'Cursor review',
                  summary: 'Waiting for Cursor review.',
                },
              });
            }

            async function complete(sha, conclusion) {
              const summary = conclusion === 'success'
                ? 'Cursor review succeeded.'
                : 'Cursor review failed.';
              const output = { title: 'Cursor review', summary };
              const existing = newestInProgress(await runsFor(sha));
              if (existing) {
                await github.rest.checks.update({
                  ...context.repo,
                  check_run_id: existing.id,
                  status: 'completed',
                  conclusion,
                  completed_at: new Date().toISOString(),
                  output,
                });
                core.info(`Completed cursor-review ${existing.id} on ${sha}: ${conclusion}.`);
                return;
              }
              await github.rest.checks.create({
                ...context.repo,
                name: CHECK_NAME,
                head_sha: sha,
                status: 'completed',
                conclusion,
                completed_at: new Date().toISOString(),
                output,
              });
              core.info(`Created completed cursor-review on ${sha}: ${conclusion}.`);
            }

            const eventName = context.eventName;

            if (eventName === 'pull_request') {
              await start(context.payload.pull_request.head.sha);
              return;
            }

            if (eventName === 'pull_request_review') {
              const { review } = context.payload;
              const conclusion = markerConclusion(review.body, review.user);
              if (!conclusion) return;
              // Stamp the commit that was reviewed. A push made during the
              // review leaves the new head waiting for its own review.
              await complete(review.commit_id, conclusion);
              return;
            }

            core.info(`Ignored event ${eventName}.`);
