name: probono-radar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: radar
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./worker
    profiles: ["worker"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://radar@127.0.0.1:5433/radar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://127.0.0.1:3003}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://a2j.policai.org}
      TZ: Australia/Sydney
    secrets:
      - postgres_password

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD

volumes:
  pgdata:
